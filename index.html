<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Black Izba — Coming Soon</title>

<style>
:root {
  --black: #030302;
  --void: #070605;
  --bone: #b8ab92;
  --bone-soft: #8e826e;
  --bone-dim: #514a3e;
  --ash: #171411;
  --red: #641111;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--black);
  color: var(--bone);
  font-family: Georgia, "Times New Roman", serif;
}

body {
  overflow-x: hidden;
}

.site {
  position: relative;
  min-height: 100vh;
  padding: 42px clamp(24px, 5vw, 76px) 34px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  isolation: isolate;
  background:
    radial-gradient(circle at 71% 20%, rgba(184,171,146,.18), transparent 18%),
    radial-gradient(circle at 50% 88%, rgba(100,17,17,.18), transparent 28%),
    linear-gradient(90deg, rgba(3,3,2,.98) 0%, rgba(3,3,2,.91) 43%, rgba(3,3,2,.72) 100%),
    radial-gradient(circle at 73% 52%, #242018, #050504 62%);
}

.site::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -3;
  background:
    linear-gradient(180deg, transparent 0 55%, rgba(0,0,0,.9) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 5px);
  opacity: .8;
}

.site::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(circle at center, transparent 0 48%, rgba(0,0,0,.72) 88%),
    linear-gradient(90deg, rgba(0,0,0,.55), transparent 22%, transparent 78%, rgba(0,0,0,.55));
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: .14;
  background-image:
    radial-gradient(circle, rgba(255,255,255,.45) 0 1px, transparent 1px);
  background-size: 3px 3px;
  mix-blend-mode: overlay;
}

.frame {
  position: fixed;
  inset: 18px;
  z-index: 40;
  pointer-events: none;
  border: 1px solid rgba(184,171,146,.17);
  box-shadow:
    inset 0 0 120px rgba(0,0,0,.96),
    0 0 60px rgba(0,0,0,.9);
}

.frame::before,
.frame::after {
  content: "ᛟ ᛉ ᛞ ᚱ ᛟ ᛉ ᛞ ᚱ ᛟ ᛉ ᛞ ᚱ ᛟ";
  position: absolute;
  top: 24px;
  bottom: 24px;
  width: 22px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing: 12px;
  color: rgba(184,171,146,.18);
  font-size: 17px;
}

.frame::before {
  left: 18px;
}

.frame::after {
  right: 18px;
}

.nav {
  display: flex;
  justify-content: center;
  gap: clamp(32px, 8vw, 128px);
  font-size: 13px;
  letter-spacing: .48em;
  text-transform: uppercase;
  color: var(--bone-soft);
}

.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(330px, 510px) 1fr;
  align-items: center;
  gap: clamp(28px, 7vw, 120px);
  min-height: calc(100vh - 150px);
  padding: 52px 0 38px;
}

.left {
  position: relative;
  z-index: 5;
  padding-left: clamp(0px, 4vw, 54px);
}

.logo {
  width: min(420px, 82vw);
  margin-bottom: 52px;
  color: var(--bone);
  filter:
    sepia(.22)
    saturate(.7)
    brightness(.88)
    contrast(1.16)
    drop-shadow(0 0 28px rgba(184,171,146,.08));
}

.logo-title {
  font-family: Impact, "Arial Black", serif;
  font-size: 86px;
  line-height: .82;
  letter-spacing: .02em;
  text-transform: uppercase;
  fill: currentColor;
  stroke: rgba(0,0,0,.35);
  stroke-width: 1.5px;
}

.logo-cross {
  stroke: currentColor;
  stroke-width: 4;
  opacity: .9;
}

.domain {
  margin: 0;
  font-size: clamp(38px, 5vw, 76px);
  line-height: .9;
  letter-spacing: .24em;
  font-weight: 400;
  text-transform: uppercase;
  color: var(--bone);
  text-shadow: 0 0 28px rgba(184,171,146,.12);
}

.separator {
  width: min(390px, 80%);
  height: 1px;
  margin: 30px 0 34px;
  background:
    linear-gradient(90deg, transparent, rgba(184,171,146,.58), transparent);
  position: relative;
}

.separator::after {
  content: "ᛟ";
  position: absolute;
  left: 50%;
  top: 50%;
  translate: -50% -50%;
  color: var(--bone-dim);
  background: var(--black);
  padding: 0 12px;
  font-size: 17px;
}

.coming {
  margin: 0 0 30px;
  font-size: clamp(20px, 2vw, 34px);
  letter-spacing: .72em;
  text-transform: uppercase;
  color: var(--bone);
}

.mark {
  margin: 0 0 28px;
  color: var(--red);
  font-size: 30px;
  letter-spacing: .2em;
}

.subline {
  margin: 0;
  max-width: 410px;
  font-size: 17px;
  line-height: 1.9;
  letter-spacing: .44em;
  text-transform: uppercase;
  color: var(--bone-soft);
}

.subscribe {
  width: min(420px, 100%);
  margin-top: 46px;
  padding: 22px 24px;
  display: grid;
  grid-template-columns: 82px 1fr;
  gap: 18px;
  border: 1px solid rgba(184,171,146,.18);
  background: rgba(0,0,0,.28);
  box-shadow: inset 0 0 36px rgba(0,0,0,.7);
}

.raven {
  font-size: 56px;
  line-height: 1;
  color: var(--bone-dim);
  filter: grayscale(1);
}

.subscribe-title {
  margin: 0 0 8px;
  font-size: 15px;
  letter-spacing: .34em;
  text-transform: uppercase;
}

.subscribe-text {
  margin: 0 0 18px;
  color: var(--bone-soft);
  font-size: 14px;
  line-height: 1.65;
  letter-spacing: .08em;
}

.email {
  display: flex;
  border: 1px solid rgba(184,171,146,.18);
  height: 38px;
}

.email input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  padding: 0 12px;
  color: var(--bone);
  font: inherit;
  outline: none;
}

.email input::placeholder {
  color: rgba(184,171,146,.38);
}

.email button {
  width: 48px;
  border: 0;
  border-left: 1px solid rgba(184,171,146,.18);
  background: transparent;
  color: var(--bone-soft);
  cursor: pointer;
  font-size: 22px;
}

.socials {
  display: flex;
  gap: 16px;
  margin-top: 28px;
}

.socials a {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(184,171,146,.2);
  color: var(--bone-soft);
  text-decoration: none;
  background: rgba(0,0,0,.2);
  transition: .22s ease;
}

.socials a:hover {
  color: var(--bone);
  border-color: rgba(184,171,146,.55);
}

.scene {
  position: relative;
  min-height: 680px;
  z-index: 2;
}

.moon {
  position: absolute;
  right: 26%;
  top: 2%;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 42% 36%, #c9bea2 0 14%, #7e7461 36%, #221f1a 65%, transparent 68%);
  opacity: .56;
  box-shadow: 0 0 76px rgba(184,171,146,.22);
}

.forest {
  position: absolute;
  inset: 4% 0 0;
  background:
    linear-gradient(to top, rgba(0,0,0,.96), transparent 45%),
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(184,171,146,.08) 35px 36px, transparent 37px 70px);
  clip-path: polygon(0 100%, 0 35%, 5% 46%, 8% 28%, 12% 52%, 16% 22%, 20% 56%, 25% 30%, 30% 58%, 34% 25%, 39% 53%, 44% 18%, 50% 48%, 57% 26%, 63% 54%, 69% 24%, 76% 50%, 82% 18%, 88% 49%, 93% 30%, 100% 44%, 100% 100%);
  opacity: .36;
}

.hut {
  position: absolute;
  right: 7%;
  top: 17%;
  width: min(510px, 48vw);
  height: 480px;
  filter: drop-shadow(0 0 44px rgba(0,0,0,.95));
  transform: rotate(-2deg);
}

.hut-roof {
  position: absolute;
  left: 12%;
  top: 0;
  width: 80%;
  height: 178px;
  background:
    linear-gradient(135deg, transparent 0 50%, rgba(184,171,146,.12) 51% 52%, transparent 53%),
    linear-gradient(45deg, transparent 0 50%, rgba(184,171,146,.1) 51% 52%, transparent 53%),
    #16120e;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  border-bottom: 1px solid rgba(184,171,146,.18);
}

.hut-body {
  position: absolute;
  left: 24%;
  top: 166px;
  width: 54%;
  height: 232px;
  background:
    repeating-linear-gradient(0deg, rgba(184,171,146,.08) 0 2px, transparent 2px 25px),
    repeating-linear-gradient(90deg, rgba(184,171,146,.08) 0 2px, transparent 2px 34px),
    #0d0b09;
  border: 1px solid rgba(184,171,146,.14);
  box-shadow: inset 0 0 60px rgba(0,0,0,.88);
}

.hut-window {
  position: absolute;
  left: 41%;
  top: 228px;
  width: 72px;
  height: 82px;
  border: 1px solid rgba(184,171,146,.25);
  background: radial-gradient(circle, rgba(120,25,12,.18), rgba(0,0,0,.88) 62%);
  box-shadow: inset 0 0 24px rgba(184,171,146,.06);
}

.hut-cross {
  position: absolute;
  left: 47%;
  top: -12px;
  width: 68px;
  height: 68px;
}

.hut-cross::before,
.hut-cross::after {
  content: "";
  position: absolute;
  background: rgba(184,171,146,.32);
}

.hut-cross::before {
  left: 31px;
  top: 0;
  width: 6px;
  height: 68px;
}

.hut-cross::after {
  left: 0;
  top: 31px;
  width: 68px;
  height: 6px;
}

.idol {
  position: absolute;
  right: 3%;
  bottom: 5%;
  width: 280px;
  height: 420px;
  opacity: .88;
}

.idol-head {
  position: absolute;
  left: 92px;
  top: 0;
  width: 92px;
  height: 112px;
  border: 2px solid rgba(184,171,146,.34);
  border-radius: 45% 45% 38% 38%;
  background:
    radial-gradient(circle at 34% 42%, rgba(184,171,146,.44) 0 6px, transparent 7px),
    radial-gradient(circle at 66% 42%, rgba(184,171,146,.44) 0 6px, transparent 7px),
    linear-gradient(90deg, transparent 46%, rgba(184,171,146,.28) 47% 52%, transparent 53%),
    #0b0908;
}

.idol-horns::before,
.idol-horns::after {
  content: "";
  position: absolute;
  top: -22px;
  width: 88px;
  height: 64px;
  border-top: 3px solid rgba(184,171,146,.34);
  border-radius: 50%;
}

.idol-horns::before {
  left: 8px;
  transform: rotate(-28deg);
}

.idol-horns::after {
  right: 8px;
  transform: rotate(28deg);
}

.idol-body {
  position: absolute;
  left: 60px;
  top: 106px;
  width: 158px;
  height: 290px;
  background:
    linear-gradient(90deg, transparent 0 47%, rgba(184,171,146,.18) 48% 51%, transparent 52%),
    #0d0a08;
  clip-path: polygon(50% 0, 70% 10%, 100% 100%, 0 100%, 30% 10%);
  border: 1px solid rgba(184,171,146,.12);
}

.idol-arms {
  position: absolute;
  left: 10px;
  top: 145px;
  width: 260px;
  height: 20px;
  background: rgba(184,171,146,.16);
  transform: rotate(-4deg);
}

.ritual {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 210px;
  background:
    radial-gradient(ellipse at 48% 72%, rgba(184,171,146,.15), transparent 30%),
    linear-gradient(transparent, rgba(0,0,0,.92) 78%);
}

.stakes {
  position: absolute;
  left: 2%;
  right: 6%;
  bottom: 48px;
  height: 120px;
  background:
    repeating-linear-gradient(90deg, transparent 0 32px, rgba(184,171,146,.13) 33px 40px, transparent 41px 60px);
  clip-path: polygon(0 100%, 0 55%, 4% 20%, 8% 60%, 12% 0, 16% 62%, 22% 18%, 26% 72%, 31% 8%, 38% 64%, 45% 16%, 50% 70%, 58% 10%, 64% 64%, 72% 18%, 78% 72%, 86% 4%, 92% 62%, 100% 24%, 100% 100%);
  opacity: .65;
}

.candles {
  position: absolute;
  left: 24%;
  bottom: 28px;
  width: 260px;
  height: 90px;
}

.candles span {
  position: absolute;
  bottom: 0;
  width: 10px;
  height: 42px;
  background: rgba(184,171,146,.18);
}

.candles span::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -16px;
  width: 10px;
  height: 20px;
  translate: -50% 0;
  border-radius: 50% 50% 50% 50%;
  background: rgba(184,171,146,.7);
  box-shadow: 0 0 24px rgba(184,171,146,.36);
}

.candles span:nth-child(1) { left: 0; height: 26px; }
.candles span:nth-child(2) { left: 70px; height: 50px; }
.candles span:nth-child(3) { left: 142px; height: 34px; }
.candles span:nth-child(4) { left: 218px; height: 44px; }

.footer {
  position: relative;
  z-index: 5;
  text-align: center;
  padding-top: 22px;
  color: var(--bone-soft);
  font-size: clamp(11px, 1.15vw, 15px);
  letter-spacing: .38em;
  text-transform: uppercase;
}

.footer::before,
.footer::after {
  content: "";
  display: inline-block;
  width: min(210px, 16vw);
  height: 1px;
  margin: 0 24px .35em;
  background: linear-gradient(90deg, transparent, rgba(184,171,146,.34));
}

.footer::after {
  background: linear-gradient(90deg, rgba(184,171,146,.34), transparent);
}

@media (max-width: 980px) {
  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
  }

  .scene {
    order: -1;
    min-height: 460px;
  }

  .hut {
    width: 520px;
    max-width: 82vw;
  }

  .left {
    padding-left: 0;
  }

  .domain {
    letter-spacing: .14em;
  }

  .coming {
    letter-spacing: .42em;
  }

  .subscribe {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .site {
    padding: 30px 22px 28px;
  }

  .frame {
    inset: 10px;
  }

  .frame::before,
  .frame::after {
    display: none;
  }

  .nav {
    gap: 16px;
    font-size: 10px;
    letter-spacing: .22em;
  }

  .scene {
    min-height: 390px;
  }

  .moon {
    width: 86px;
    height: 86px;
    right: 22%;
  }

  .idol {
    scale: .72;
    transform-origin: right bottom;
  }

  .footer {
    letter-spacing: .18em;
    line-height: 1.8;
  }

  .footer::before,
  .footer::after {
    display: none;
  }
}
</style>
</head>

<body>
  <div class="frame"></div>
  <div class="noise"></div>

  <main class="site">
    <nav class="nav">
      <span>Music</span>
      <span>Culture</span>
      <span>Our Own</span>
    </nav>

    <section class="hero">
      <div class="left">
        <svg class="logo" viewBox="0 0 720 390" role="img" aria-label="Black Izba logo">
          <line class="logo-cross" x1="360" y1="18" x2="360" y2="78"/>
          <line class="logo-cross" x1="330" y1="48" x2="390" y2="48"/>
          <line class="logo-cross" x1="360" y1="312" x2="360" y2="372"/>
          <line class="logo-cross" x1="330" y1="342" x2="390" y2="342"/>

          <text class="logo-title" x="50%" y="158" text-anchor="middle">BLACK</text>
          <text class="logo-title" x="50%" y="294" text-anchor="middle">IZBA</text>
        </svg>

        <h1 class="domain">Blackizba.com</h1>

        <div class="separator"></div>

        <p class="coming">Coming Soon</p>

        <div class="mark">ᛟ</div>

        <p class="subline">
          Something real<br>
          is being born
        </p>

        <div class="subscribe">
          <div class="raven">◆</div>
          <div>
            <p class="subscribe-title">Stay in the dark</p>
            <p class="subscribe-text">Subscribe to get updates from the Blackizba.</p>
            <form class="email">
              <input type="email" placeholder="Your email" />
              <button type="submit" aria-label="Submit">→</button>
            </form>
          </div>
        </div>

        <div class="socials">
          <a href="#" aria-label="Instagram">◎</a>
          <a href="#" aria-label="VK">VK</a>
          <a href="#" aria-label="Telegram">↗</a>
          <a href="mailto:info@blackizba.com" aria-label="Email">✉</a>
        </div>
      </div>

      <div class="scene" aria-hidden="true">
        <div class="moon"></div>
        <div class="forest"></div>

        <div class="hut">
          <div class="hut-cross"></div>
          <div class="hut-roof"></div>
          <div class="hut-body"></div>
          <div class="hut-window"></div>
        </div>

        <div class="idol">
          <div class="idol-horns"></div>
          <div class="idol-head"></div>
          <div class="idol-arms"></div>
          <div class="idol-body"></div>
        </div>

        <div class="ritual">
          <div class="stakes"></div>
          <div class="candles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      Born under the sun. Loyal to the shadows
    </footer>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Izba</title>

<style>
:root{
    --bg:#050505;
    --gold:#b08a3c;
    --gold-soft:#d5b46a;
    --text:#e7d9b1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at center, rgba(176,138,60,.12), transparent 45%),
        #050505;
    color:var(--text);
    font-family: Georgia, serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.015),
            rgba(255,255,255,.015) 1px,
            transparent 1px,
            transparent 3px
        );
    pointer-events:none;
}

.container{
    width:min(700px,90%);
    padding:60px 30px;
    border:1px solid rgba(176,138,60,.35);
    background:rgba(0,0,0,.45);
}

.symbol{
    color:var(--gold);
    font-size:42px;
    margin-bottom:20px;
}

h1{
    font-size:clamp(56px,10vw,110px);
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold-soft);
    line-height:.9;
}

.line{
    width:180px;
    height:1px;
    background:var(--gold);
    margin:30px auto;
    opacity:.5;
}

.status{
    text-transform:uppercase;
    letter-spacing:.3em;
    font-size:12px;
    color:var(--gold-soft);
}

.coming{
    margin-top:14px;
    color:#9f8650;
}

footer{
    margin-top:50px;
    font-size:13px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--gold);
}
</style>
</head>

<body>

<div class="container">
    <div class="symbol">✦</div>

    <h1>Black Izba</h1>

    <div class="line"></div>

    <p class="status">Website under construction</p>
    <p class="coming">First collection coming soon</p>

    <footer>
        Born under the sun. Loyal to the shadows.
    </footer>
</div>

</body>
</html>
